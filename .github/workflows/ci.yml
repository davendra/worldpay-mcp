name: CI

on:
  push:
    branches: [main, "docs/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Smoke-test stdio server advertises 9 tools
        env:
          WORLDPAY_USERNAME: ci
          WORLDPAY_PASSWORD: ci
          WORLDPAY_URL: https://try.access.worldpay.com
          MERCHANT_ENTITY: ci
        run: |
          npx -y @modelcontextprotocol/inspector --cli node dist/server-stdio.js --method tools/list > tools.json
          node -e "const t=require('./tools.json').tools; if(t.length!==9){console.error('expected 9 tools, got',t.length);process.exit(1)}; console.log('tools:',t.map(x=>x.name).join(', '))"
